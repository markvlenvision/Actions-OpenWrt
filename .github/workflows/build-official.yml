name: 编译 OpenWrt (Official)

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      branch:
        description: 'OpenWrt 分支或 Tag'
        required: false
        default: 'v25.12.6'
        type: string

jobs:
  call-official-build:
    uses: ./.github/workflows/openwrt-build-reusable.yml
    with:
      build_label: Official
      repo_url: https://github.com/openwrt/openwrt.git
      repo_branch: ${{ inputs.branch || 'v25.12.6' }}
      src_dir_name: openwrt
      config_dir: openwrt_official
      upload_bin_dir: false
      upload_firmware: true
      upload_release: true
      timezone: Asia/Shanghai