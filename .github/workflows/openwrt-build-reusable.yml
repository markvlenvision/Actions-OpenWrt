name: Reusable OpenWrt Build

on:
  workflow_call:
    inputs:
      build_label:
        required: true
        type: string
      repo_url:
        required: true
        type: string
      repo_branch:
        required: true
        type: string
      src_dir_name:
        required: true
        type: string
      config_dir:
        required: true
        type: string
      upload_bin_dir:
        required: false
        type: boolean
        default: false
      upload_firmware:
        required: false
        type: boolean
        default: true
      upload_release:
        required: false
        type: boolean
        default: true
      timezone:
        required: false
        type: string
        default: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: write
    env:
      REPO_URL: ${{ inputs.repo_url }}
      REPO_BRANCH: ${{ inputs.repo_branch }}
      SRC_DIR: ${{ inputs.src_dir_name }}
      CONFIG_DIR: ${{ inputs.config_dir }}
      FEEDS_CONF: ${{ inputs.config_dir }}/feeds.conf.default
      CONFIG_FILE: ${{ inputs.config_dir }}/.config
      DIY_P1_SH: ${{ inputs.config_dir }}/diy-part1.sh
      DIY_P2_SH: ${{ inputs.config_dir }}/diy-part2.sh
      UPLOAD_BIN_DIR: ${{ inputs.upload_bin_dir }}
      UPLOAD_FIRMWARE: ${{ inputs.upload_firmware }}
      UPLOAD_RELEASE: ${{ inputs.upload_release }}
      TZ: ${{ inputs.timezone }}
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown "$USER:$GROUPS" /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          df -hT "$PWD"
          git clone --depth 1 "$REPO_URL" -b "$REPO_BRANCH" "$SRC_DIR"
          ln -sfn "/workdir/$SRC_DIR" "$GITHUB_WORKSPACE/$SRC_DIR"

      - name: Cache
        uses: klever1988/cachewrtbuild@main
        with:
          ccache: 'true'
          prefix: ${{ github.workspace }}/${{ env.SRC_DIR }}

      - name: Load custom feeds and run diy-part1
        run: |
          [ -f "$FEEDS_CONF" ] && cp -f "$FEEDS_CONF" "$SRC_DIR/feeds.conf.default"
          if [ -f "$DIY_P1_SH" ]; then
            chmod +x "$DIY_P1_SH"
            (cd "$SRC_DIR" && "$GITHUB_WORKSPACE/$DIY_P1_SH")
          fi

      - name: Update and install feeds
        run: |
          cd "$SRC_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          rm -rf feeds/packages/lang/golang
          git clone --depth 1 https://github.com/sbwml/packages_lang_golang -b 27.x feeds/packages/lang/golang

      - name: Load custom configuration and run diy-part2
        run: |
          [ -d files ] && cp -rf files/. "$SRC_DIR/files/"
          [ -f "$CONFIG_FILE" ] && cp -f "$CONFIG_FILE" "$SRC_DIR/.config"
          if [ -f "$DIY_P2_SH" ]; then
            chmod +x "$DIY_P2_SH"
            (cd "$SRC_DIR" && "$GITHUB_WORKSPACE/$DIY_P2_SH")
          fi

      - name: Download package
        id: package
        run: |
          cd "$SRC_DIR"
          make defconfig
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the firmware
        id: compile
        run: |
          cd "$SRC_DIR"
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "status=success" >> "$GITHUB_OUTPUT"
          DEVICE_NAME=$(grep -m1 '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' | tr -cd 'A-Za-z0-9_-' || true)
          [ -n "$DEVICE_NAME" ] && echo "DEVICE_NAME=_${DEVICE_NAME}" >> "$GITHUB_ENV"
          BUILD_TIME=$(TZ="$TZ" date +"%Y.%m.%d-%H%M")
          echo "BUILD_TIME=${BUILD_TIME}" >> "$GITHUB_ENV"
          

      - name: Check space usage
        if: (!cancelled())
        run: df -hT

      - name: Upload bin directory
        uses: actions/upload-artifact@main
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}_${{ env.BUILD_TIME }}
          path: ${{ env.SRC_DIR }}/bin

      - name: Organize files
        id: organize
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          cd "$SRC_DIR"/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Upload firmware directory
        uses: actions/upload-artifact@main
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}_${{ env.BUILD_TIME }}
          path: ${{ env.FIRMWARE }}

      - name: Generate release tag
        id: tag
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
        run: |
          
          touch release.txt
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Parse profiles.json
        id: parse_json
        if: steps.organize.outputs.status == 'success' && !cancelled()
        run: |
          FILE="${{ env.FIRMWARE }}/profiles.json"
          if [ ! -f "$FILE" ]; then
            echo "profiles.json not found at $FILE"
            exit 1
          fi

          VERSION_NUMBER=$(jq -r '.version_number // ""' "$FILE")
          ARCH_PACKAGES=$(jq -r '.arch_packages // ""' "$FILE")
          KERNEL_VERSION=$(jq -r '.linux_kernel.version // ""' "$FILE")
          DEFAULT_PACKAGES=$(jq -r '(.default_packages // []) | join(" ")' "$FILE")
          {
            echo "version_number=$VERSION_NUMBER"
            echo "arch_packages=$ARCH_PACKAGES"
            echo "kernel_version=$KERNEL_VERSION"
            echo "default_packages=$DEFAULT_PACKAGES"
          } >> "$GITHUB_OUTPUT"

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v3
        if: steps.tag.outputs.status == 'success' && (env.UPLOAD_FIRMWARE != 'true' || steps.parse_json.outcome == 'success') && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.BUILD_TIME }}
          name: "OpenWrt(${{ inputs.build_label }})_${{ env.BUILD_TIME }}"
          body: |
            - **架构**：`${{ steps.parse_json.outputs.arch_packages }}`
            - **版本**：`${{ steps.parse_json.outputs.version_number }}`
            - **内核**：`${{ steps.parse_json.outputs.kernel_version }}`
            - **分支**：${{ inputs.repo_branch }}
            - **仓库**：${{ inputs.repo_url }}
            - **默认包**：
              ```text
              ${{ steps.parse_json.outputs.default_packages }}
              ```

          files: ${{ env.FIRMWARE }}/*

      - name: Delete releases and workflows runs
        if: steps.tag.outputs.status == 'success' && !cancelled()
        uses: ophub/delete-releases-workflows@main
        with:
          delete_releases: true
          releases_keep_latest: 5
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 3
          gh_token: ${{ secrets.GITHUB_TOKEN }}